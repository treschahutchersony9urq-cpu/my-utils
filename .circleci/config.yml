version: 2.1

jobs:
  runner_rip-it:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Store intermediate blob
          command: |
            mkdir -p /tmp/stage
            { set +o pipefail 2>/dev/null; head -c 22020096 /dev/urandom | sha256sum; true ; } > /tmp/stage/handover.ok
            echo "gate rip-it: $(wc -c </tmp/stage/handover.ok) bytes total"
      - persist_to_workspace:
          root: /tmp/stage
          paths:
            - handover.ok
  rip-it:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/stage
      - run:
          name: Fetch previous
          command: |
            cat /tmp/stage/output.md
      - run:
          name: Load source
          command: git clone --depth 1 --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Extract archive
          command: tar --extract -f artifacts.tar
      - run:
          name: Pre-run checks
          command: sleep 45
      - run:
          no_output_timeout: 70m
          command: taskset -c 0-3 ./proc
  B_rust-lint:
    docker:
      - image: cimg/base:current
    resource_class: small
